<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>wireDetour</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123456"/>
      <stop offset="1" stop-color="#0B6E7F"/>
    </linearGradient>
    <linearGradient id="detour" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F5F7"/>
      <stop offset="0.55" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- body: tail curl rising into the fork -->
  <path d="M 380 905 C 300 890, 300 800, 400 790 C 520 778, 560 700, 512 600"
        fill="none" stroke="#F2F5F7" stroke-width="104" stroke-linecap="round"/>

  <!-- left neck (the normal road) -->
  <path d="M 512 610 C 470 520, 330 500, 300 360"
        fill="none" stroke="#F2F5F7" stroke-width="92" stroke-linecap="round"/>
  <!-- right neck (the detour) -->
  <path d="M 512 610 C 554 520, 694 500, 724 360"
        fill="none" stroke="url(#detour)" stroke-width="92" stroke-linecap="round"/>

  <!-- left head, facing left -->
  <g transform="translate(296 340) scale(-1 1)">
    <path d="M -58 -36 C -28 -78, 40 -76, 74 -52 L 162 -24 L 156 -4 L 76 2 L 148 24 L 136 38 L 44 50 C 10 64, -42 62, -60 40 Z" fill="#F2F5F7"/>
    <path d="M -24 -60 C -70 -104, -124 -118, -170 -112 C -120 -92, -80 -64, -58 -30 Z" fill="#F2F5F7"/>
    <path d="M 14 -70 C -10 -122, -50 -150, -88 -158 C -58 -122, -40 -92, -30 -62 Z" fill="#F2F5F7"/>
    <path d="M 18 -40 C 34 -50, 56 -48, 68 -38" fill="none" stroke="#123456" stroke-width="8" stroke-linecap="round"/>
    <circle cx="44" cy="-24" r="12" fill="#123456"/>
    <circle cx="140" cy="-22" r="5" fill="#123456"/>
  </g>

  <!-- right head, facing right (the detour) -->
  <g transform="translate(728 340)">
    <path d="M -58 -36 C -28 -78, 40 -76, 74 -52 L 162 -24 L 156 -4 L 76 2 L 148 24 L 136 38 L 44 50 C 10 64, -42 62, -60 40 Z" fill="#FF7A2F"/>
    <path d="M -24 -60 C -70 -104, -124 -118, -170 -112 C -120 -92, -80 -64, -58 -30 Z" fill="#FF7A2F"/>
    <path d="M 14 -70 C -10 -122, -50 -150, -88 -158 C -58 -122, -40 -92, -30 -62 Z" fill="#FF7A2F"/>
    <path d="M 18 -40 C 34 -50, 56 -48, 68 -38" fill="none" stroke="#123456" stroke-width="8" stroke-linecap="round"/>
    <circle cx="44" cy="-24" r="12" fill="#123456"/>
    <circle cx="140" cy="-22" r="5" fill="#123456"/>
  </g>
</svg>
